<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台北 → 日本 機票追蹤</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --good: #12805c; --good-bg: #e3f5ee; --warn: #9a5b00; --accent: #2458d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color .15s; }
  .card:hover { border-color: #b9c2d3; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .city { font-weight: 600; }
  .card .price { font-size: 24px; font-weight: 700; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; }
  .badge.good { background: var(--good-bg); color: var(--good); }
  .badge.warn { background: #fff3df; color: var(--warn); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 4px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chart-wrap { position: relative; height: 300px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; }
  tr.good td.num { color: var(--good); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>✈️ 台北 → 日本 機票追蹤</h1>
    <span class="muted" id="updated"></span>
  </header>

  <div class="cards" id="cards"></div>

  <section class="panel">
    <h2 id="chart-title">價格走勢</h2>
    <div class="tabs" id="month-tabs"></div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </section>

  <section class="panel">
    <h2 id="table-title">最便宜的航班</h2>
    <div class="table-wrap" id="offers"></div>
    <p class="muted">價格來自 Travelpayouts 快取資料，可能與即時價格不同，下訂前請點連結確認。</p>
  </section>
</main>

<script>
const COLORS = ["#2458d6", "#d6452b", "#12805c", "#8a3ffc", "#c77c00"];
const state = { latest: null, history: [], city: null, month: "all", chart: null };
const fmt = n => n == null ? "—" : n.toLocaleString("zh-TW");
const $ = id => document.getElementById(id);

async function load() {
  try {
    const [latest, history] = await Promise.all([
      fetch("data/latest.json", { cache: "no-store" }).then(r => r.json()),
      fetch("data/history.json", { cache: "no-store" }).then(r => r.json()),
    ]);
    state.latest = latest;
    state.history = history;
  } catch (e) {
    document.querySelector("main").insertAdjacentHTML("beforeend",
      '<div class="panel empty">還沒有資料。請先在 GitHub Actions 手動執行一次「Track fares」。</div>');
    return;
  }
  $("updated").textContent = "更新時間：" + state.latest.updated_at.replace("T", " ");
  state.city = cities()[0]?.code;
  render();
}

function cities() {
  const seen = new Map();
  for (const r of state.latest.routes) if (!seen.has(r.code)) seen.set(r.code, { code: r.code, name: r.name, target: r.target_price });
  return [...seen.values()];
}
function months() { return [...new Set(state.latest.routes.map(r => r.month))].sort(); }
function routesOf(code) { return state.latest.routes.filter(r => r.code === code); }

function render() { renderCards(); renderTabs(); renderChart(); renderOffers(); }

function renderCards() {
  $("cards").innerHTML = cities().map(c => {
    const best = routesOf(c.code).flatMap(r => r.offers.map(o => ({ ...o, month: r.month })))
      .sort((a, b) => a.price - b.price)[0];
    const good = best && best.price <= c.target;
    const badge = !best ? '<span class="badge warn">無資料</span>'
      : good ? '<span class="badge good">低於目標</span>'
      : `<span class="badge warn">差 ${fmt(best.price - c.target)}</span>`;
    return `<div class="card ${c.code === state.city ? "active" : ""}" data-code="${c.code}">
      <div class="city">${c.name} <span class="muted">${c.code}</span></div>
      <div class="price">${best ? fmt(best.price) : "—"}</div>
      <div class="muted">目標 ${fmt(c.target)}${best ? " · " + best.departure_at.slice(5, 10) + " 出發" : ""}</div>
      <div style="margin-top:6px">${badge}</div></div>`;
  }).join("");
  document.querySelectorAll(".card").forEach(el => el.onclick = () => { state.city = el.dataset.code; render(); });
}

function renderTabs() {
  const opts = [["all", "全部月份"], ...months().map(m => [m, m.replace("-", " 年 ") + " 月"])];
  $("month-tabs").innerHTML = opts.map(([v, label]) =>
    `<button class="${v === state.month ? "active" : ""}" data-m="${v}">${label}</button>`).join("");
  document.querySelectorAll("#month-tabs button").forEach(b => b.onclick = () => { state.month = b.dataset.m; render(); });
}

function renderChart() {
  const city = cities().find(c => c.code === state.city);
  $("chart-title").textContent = `價格走勢：${city?.name ?? ""}`;
  // 每次抓價的時間點，取所選月份中的最低價；「全部月份」則每個月份各一條線
  const rows = state.history.filter(h => h.code === state.city);
  const mList = state.month === "all" ? months() : [state.month];
  const datasets = mList.map((m, i) => ({
    label: m,
    data: rows.filter(h => h.month === m).map(h => ({ x: h.t.slice(0, 16).replace("T", " "), y: h.price })),
    borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length],
    tension: .25, pointRadius: 2, borderWidth: 2,
  }));
  datasets.push({
    label: "目標價", data: [...new Set(rows.map(h => h.t.slice(0, 16).replace("T", " ")))].map(x => ({ x, y: city?.target })),
    borderColor: "#999", borderDash: [6, 4], pointRadius: 0, borderWidth: 1,
  });
  state.chart?.destroy();
  state.chart = new Chart($("chart"), {
    type: "line",
    data: { datasets },
    options: {
      maintainAspectRatio: false, parsing: { xAxisKey: "x", yAxisKey: "y" },
      interaction: { mode: "index", intersect: false },
      scales: { x: { type: "category", labels: [...new Set(rows.map(h => h.t.slice(0, 16).replace("T", " ")))], ticks: { maxTicksLimit: 8 } },
                y: { ticks: { callback: v => fmt(v) } } },
      plugins: { tooltip: { callbacks: { label: c => `${c.dataset.label}：${fmt(c.parsed.y)}` } } },
    },
  });
}

function gflights(o) {
  const q = `Flights to ${state.city} from TPE on ${o.departure_at.slice(0, 10)}` + (o.return_at ? ` through ${o.return_at.slice(0, 10)}` : " one way");
  return `https://www.google.com/travel/flights?q=${encodeURIComponent(q)}&curr=TWD&hl=zh-TW`;
}

function renderOffers() {
  const city = cities().find(c => c.code === state.city);
  $("table-title").textContent = `最便宜的航班：${city?.name ?? ""}`;
  const offers = routesOf(state.city).filter(r => state.month === "all" || r.month === state.month)
    .flatMap(r => r.offers).sort((a, b) => a.price - b.price).slice(0, 15);
  if (!offers.length) { $("offers").innerHTML = '<div class="empty">這段期間沒有價格資料</div>'; return; }
  const stops = n => n === 0 ? "直飛" : `轉 ${n} 次`;
  $("offers").innerHTML = `<table><thead><tr>
      <th>價格</th><th>去程</th><th>回程</th><th>天數</th><th>航空</th><th>機場</th><th>轉機</th><th>連結</th>
    </tr></thead><tbody>${offers.map(o => {
      const days = o.return_at ? Math.round((new Date(o.return_at.slice(0, 10)) - new Date(o.departure_at.slice(0, 10))) / 864e5) : "—";
      return `<tr class="${o.price <= city.target ? "good" : ""}">
        <td class="num">${fmt(o.price)}</td>
        <td>${o.departure_at.slice(0, 10)}</td><td>${o.return_at ? o.return_at.slice(0, 10) : "單程"}</td>
        <td>${days}</td><td>${o.airline ?? ""} ${o.flight_number ?? ""}</td><td>${o.destination_airport ?? ""}</td>
        <td>${stops(o.transfers)}${o.return_at ? " / " + stops(o.return_transfers) : ""}</td>
        <td>${o.link ? `<a href="${o.link}" target="_blank" rel="noopener">Aviasales</a> · ` : ""}<a href="${gflights(o)}" target="_blank" rel="noopener">Google</a></td>
      </tr>`;
    }).join("")}</tbody></table>`;
}

load();
</script>
</body>
</html>
